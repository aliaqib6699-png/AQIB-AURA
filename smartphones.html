<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"DM Sans",sans-serif;
    background:#090c18;
    color:#f7f8ff;
    line-height:1.7;
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    width:420px;
    height:420px;
    border-radius:50%;
    background:rgba(92,76,255,.16);
    filter:blur(100px);
    top:-160px;
    right:-100px;
    pointer-events:none;
    z-index:-2;
}

body:after{
    content:"";
    position:fixed;
    width:360px;
    height:360px;
    border-radius:50%;
    background:rgba(0,210,255,.09);
    filter:blur(100px);
    bottom:-120px;
    left:-100px;
    pointer-events:none;
    z-index:-2;
}

a{
    color:inherit;
    text-decoration:none;
}

.container{
    width:min(1120px,92%);
    margin:auto;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    background:rgba(9,12,24,.78);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.nav{
    min-height:72px;
    display:flex;
    align-items:center;

    gap:20px;
}

.logo{
    font-size:24px;
    font-weight:800;
    letter-spacing:-.8px;
}

.logo span{
    opacity:.5;
}

.nav-links{
    display:flex;
    gap:26px;
    align-items:center;
}
